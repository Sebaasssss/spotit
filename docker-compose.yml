# Servicios base de SpotIt: iguales en local y en AWS (EC2).
# Lo exclusivo de desarrollo va en docker-compose.override.yml.
# Toda la configuración llega desde .env (copiar .env.example).
name: spotit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Dar tiempo a Postgres para cerrar limpio; si se le mata, el siguiente arranque
    # hace recuperación y puede tardar más de un minuto.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Durante este margen los fallos no cuentan; se comprueba cada 2 s para no retrasar el arranque.
      start_period: 120s
      start_interval: 2s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # nginx entrega las fotos (X-Accel-Redirect) desde el volumen compartido.
      MEDIA_X_ACCEL: "True"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Envía los avisos push encolados (bandeja AvisoPush). Misma imagen que el backend, sin
  # migrar: espera a que el backend esté sano (él aplica las migraciones al arrancar).
  push-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    entrypoint: ["python", "manage.py"]
    command: ["enviar_push", "--loop"]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Se incrusta en el build de Vite (no es secreto). Ver .env.example.
        VITE_MAPA_CENTRO: ${VITE_MAPA_CENTRO:-}
    restart: unless-stopped
    volumes:
      # Solo lectura: nginx sirve las fotos, nunca las escribe.
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    # Único servicio expuesto al exterior.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  media:
